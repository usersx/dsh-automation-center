name: Publish verified npm package

on:
  release:
    types: [published]

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'usersx/dsh-automation-center'
    runs-on: ubuntu-latest
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - name: Set up Node.js and npm trusted publishing
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: Verify tag and package
        id: metadata
        run: |
          VERSION=$(node -p "require('./package.json').version")
          test "${{ github.event.release.tag_name }}" = "v${VERSION}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
      - name: Install, test, and build
        run: |
          pnpm install --frozen-lockfile
          pnpm check
      - name: Pack reproducible release artifact
        id: pack
        run: |
          mkdir -p dist
          npm pack --pack-destination dist
          TARBALL=$(find dist -name 'dsh-automation-center-*.tgz' -print -quit)
          test -n "${TARBALL}"
          sha256sum "${TARBALL}" > "${TARBALL}.sha256"
          echo "tarball=${TARBALL}" >> "${GITHUB_OUTPUT}"
      - name: Check public npm state
        id: registry
        env:
          PACKAGE_VERSION: ${{ steps.metadata.outputs.version }}
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: |
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          if PUBLISHED_SHASUM=$(npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" dist.shasum --registry https://registry.npmjs.org 2>/dev/null); then
            LOCAL_SHASUM=$(sha1sum "${TARBALL}" | cut -d ' ' -f 1)
            test "${PUBLISHED_SHASUM}" = "${LOCAL_SHASUM}"
            echo "publish=false" >> "${GITHUB_OUTPUT}"
            echo "Verified existing npm artifact ${PACKAGE_NAME}@${PACKAGE_VERSION} (${LOCAL_SHASUM})"
          else
            npm ping --registry https://registry.npmjs.org
            echo "publish=true" >> "${GITHUB_OUTPUT}"
          fi
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .
          format: spdx-json
          output-file: dist/dsh-automation-center-${{ steps.metadata.outputs.version }}.spdx.json
          upload-artifact: false
      - name: Attest the npm tarball with Sigstore
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: ${{ steps.pack.outputs.tarball }}
      - name: Attach package, checksum, and SBOM to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/* --clobber
      - name: Upload release evidence to Actions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dsh-automation-center-${{ steps.metadata.outputs.version }}
          path: dist/
          if-no-files-found: error
          retention-days: 90
      - name: Publish to npm with provenance
        if: steps.registry.outputs.publish == 'true'
        # GitHub assets and Actions evidence are durable before this optional
        # external publication. A missing npm Trusted Publisher must not leave
        # the GitHub Release without its verified artifacts.
        # npm treats a bare path beginning with `dist/` as a package spec in
        # recent releases. Prefix the artifact with `./` so it is always the
        # tarball produced by the verified pack step.
        run: npm publish "./${{ steps.pack.outputs.tarball }}" --access public --tag latest --provenance
