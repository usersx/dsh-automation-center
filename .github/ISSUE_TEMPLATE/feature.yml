name: Feature proposal
description: Propose an implementation item from the accepted Automation Center design.
title: "[Feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: outcome
    attributes:
      label: User-visible outcome
      description: Describe what a user can observe after this is complete.
    validations:
      required: true
  - type: input
    id: acceptance
    attributes:
      label: Acceptance IDs
      description: Reference the relevant IDs from docs/acceptance-criteria.zh-CN.md.
      placeholder: B-01, C-01
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope and non-goals
    validations:
      required: true

